<mat-toolbar color="primary"
             class="bg-linear-to-r! from-primary from-0 via-primary via-[256px] to-tertiary to-100% dark:from-primary-dark dark:to-tertiary-dark dark:via-primary-dark">
<!--  class="bg-linear-to-r! from-tertiary from-0 via-tertiary via-[256px] to-primary to-100% dark:from-tertiary-dark dark:to-primary-dark dark:via-tertiary-dark">-->
  <mat-toolbar-row class="gap-2">
    <button mat-icon-button aria-label="Menu button" (click)="toggleMenu()">
      <mat-icon class="material-symbols-outlined">menu</mat-icon>
    </button>
    <app-logo class="max-h-12" [url]="appCustomizationService.brandingCustomization().logo"/>

    <span class="flex-auto"></span>

    @if (localeService.locales()) {
      @if (localeService.locales().length > 1) {
        <button matButton [matMenuTriggerFor]="languageMenu" aria-label="Language button">
          <span class="flex items-center gap-1">
            <mat-icon class="material-symbols-outlined">language</mat-icon>
            <span>{{ localeService.currentLocale()?.shortLabel || localeService.currentLocale()?.label }}</span>
          </span>
        </button>

        <mat-menu #languageMenu="matMenu" xPosition="before" class="w-64">
          @for (language of localeService.locales(); track language.code) {
            <button mat-menu-item
                    [class]="localeService.currentLocale()?.locale === language.locale ? 'text-primary! dark:text-primary-dark!' : ''"
                    (click)="switchLanguage(language)">
              <span>{{ language.label }}</span>
            </button>
          }
        </mat-menu>
      }
    }

    @if (authService.user(); as user) {
      <button mat-icon-button aria-label="User account button" [matMenuTriggerFor]="userMenu">
        <mat-icon class="material-symbols-outlined">account_circle</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" xPosition="before" class="w-64">
        <div class="bg-primary/40 dark:bg-primary-dark/40 dark:text-white p-4">
          <span>{{ user.firstName || user.login }}</span>
        </div>
        <button mat-menu-item [routerLink]="['/admin','profile']">
          <mat-icon class="material-symbols-outlined">account_circle</mat-icon>
          <span>{{ 'Profile' | translate }}</span>
        </button>
        <button mat-menu-item [routerLink]="['/admin','change-password']">
          <mat-icon class="material-symbols-outlined">lock</mat-icon>
          <span>{{ 'Reset Password' | translate }}</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon class="material-symbols-outlined">logout</mat-icon>
          <span>{{ 'Sign Out' | translate }}</span>
        </button>
      </mat-menu>
    }

      <button mat-icon-button aria-label="Light/Dark mode button" (click)="themeService.toggleTheme()">
        <span class="material-symbols-outlined">{{ themeService.isLightTheme() ? "dark_mode" : "light_mode" }}</span>
      </button>
  </mat-toolbar-row>
</mat-toolbar>
