@let _i18nMenu = `AUTH.MENU`;

@if (authService.user(); as user) {
  <button mat-icon-button aria-label="User account button" [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before" class="w-64">
    <p mat-menu-item class="bg-primary/20!">
      <span>{{ user.firstName || user.login }}</span>
    </p>
    <button mat-menu-item [routerLink]="['/admin','profile']">
      <mat-icon>account_circle</mat-icon>
      <span>{{ `${_i18nMenu}.profile` | translate }}</span>
    </button>
    <button mat-menu-item [routerLink]="['/admin','change-password']">
      <mat-icon>lock</mat-icon>
      <span>{{ `${_i18nMenu}.resetPassword` | translate }}</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>{{ `${_i18nMenu}.logout` | translate }}</span>
    </button>
  </mat-menu>
}
