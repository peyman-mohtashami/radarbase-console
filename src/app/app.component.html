<div class="flex flex-col h-full">
  <app-toolbar />
  <div class="flex grow min-h-0">
    <aside class="h-full bg-primary shrink-0 flex flex-col transition-property:width duration-300"
           [class]="menuState.isOpen() ? 'w-64' : 'w-22'">
      <div class="overflow-y-auto grow min-h-0">
        <app-sidebar-nav />
      </div>
      <app-footer class="shrink-0"/>
    </aside>
    <main class="grow overflow-y-auto">
      <router-outlet/>
    </main>
  </div>
</div>
