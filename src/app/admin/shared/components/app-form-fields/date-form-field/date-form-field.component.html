<label for="project-name" class="text-sm">{{ label() | translate }}
  @if (required()) {
    *
  }
</label>
<mat-form-field class='small-input w-full' subscriptSizing="fixed" [appearance]='appearance()'>
  <input id="description" matInput [formField]="field()"
         [matDatepicker]='startDatePicker'
         [min]="minDate"
         [max]="maxDate"
         [placeholder]='placeholder() || "dd/MM/yyyy"'/>
  <mat-datepicker-toggle matSuffix [for]='startDatePicker'/>
  <mat-datepicker #startDatePicker/>
  <mat-error>
    @if (field()().touched() && field()().invalid()) {
      @for (error of field()().errors(); track error.kind) {
        {{ error.message | translate }}
      }
    }
  </mat-error>
</mat-form-field>
