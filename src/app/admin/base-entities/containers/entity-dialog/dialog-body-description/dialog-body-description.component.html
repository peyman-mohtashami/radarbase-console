<div class='mb-4 text-base'>
  <ng-content/>
  @if (dialogMode() === DialogMode.DELETE) {
    <div class="mt-4">
      <p>{{ "SHARED.dialog.deleteMessage" | translate }} {{ label() }}: <strong>{{ entityName() }}</strong>.</p>
      <p>{{ "SHARED.dialog.deleteWarning" | translate }}</p>
    </div>
  }
</div>
