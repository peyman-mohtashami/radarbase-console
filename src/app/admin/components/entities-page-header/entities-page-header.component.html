  <ng-content select="[top-filter]" />

  <div class="flex items-center gap-2">
    <ng-content select="[extra-buttons]" />

    @if (isGridView !== undefined) {
      <button type='button'
              class=""
              mat-icon-button
              color="primary"
              (click)="toggleGridListView()">
        <span class="material-symbols-outlined">{{ isGridView ? "list" : "grid_view" }}</span>
      </button>
    }
    <ng-container *rbPermission="permission$()">
      @if (enableAddButton$()) {
        <button (click)="router.navigate([], {relativeTo: route, queryParamsHandling: 'preserve', fragment: `/add/${entityName$()}`})"
                mat-stroked-button
                color="primary"
                type="button">
            <span class="font-bold flex items-center gap-2">
              <span class="material-symbols-outlined">add</span>
              {{ 'ADMIN.' + entityName$() + '.create' | translate }}
            </span>
        </button>
