<div *ngIf="entityName && entity"
     class='px-4 pt-2 flex flex-wrap items-center bg-white dark:bg-neutral-700'>
  <div class='flex flex-wrap gap-2 items-center'>
    <span class="material-symbols-outlined bg-neutral-100 dark:bg-neutral-600 rounded-full cursor-pointer" rbBackButton>chevron_left</span>
    <button class="small-button bg-neutral-100! dark:bg-neutral-600! dark:text-white!" mat-flat-button
            [routerLink]="[ENTITIES[entityName].route]">
      <span class="flex items-center gap-1">
        <span class="material-symbols-outlined text-lg" matPrefix>{{ ENTITIES[entityName].icon }}</span>
        <span>{{ 'ADMIN.' + entityName + '.title.plural' | translate }}</span>
      </span>
    </button>
    <span class="text-xs font-bold">{{ entity.name }}</span>
  </div>
</div>
