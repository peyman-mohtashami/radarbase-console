@let entity = store.selected();

@if (entity) {
  <div
    class='sticky top-0 z-30 flex flex-wrap justify-between gap-2 p-4 w-full bg-primary/10'>
    <div class='flex flex-wrap gap-2 items-center'>
      <button class="app-button-small app-button-full-corner" mat-flat-button
              [routerLink]="['/admin', 'source-types']">
        <mat-icon class="material-symbols-outlined">{{ ENTITY_REGISTRY.sourceType.icon }}</mat-icon>
        <span>{{ `ADMIN.${ENTITY_REGISTRY.sourceType.name}.title.singular` | translate }}</span>
      </button>

      <h2 class='flex items-center gap-2 m-0 text-lg font-bold text-primary'>
        {{ `${entity.producer}/${entity.model}/${entity.catalogVersion}` }}
      </h2>
    </div>

    <app-source-type-actions [entity]="entity" [isExpanded]="true"/>
  </div>

  <div [class]="'m-4'">
    <nav class="border-b-2 border-neutral-200"
         mat-tab-nav-bar
         mat-stretch-tabs="false"
         [tabPanel]="tabPanel">
      @for (link of links; track link) {
        <a mat-tab-link
           routerLinkActive #rla="routerLinkActive"
           [active]="rla.isActive"
           [routerLink]="['/', 'admin', 'source-types', entity.producer, entity.model, entity.catalogVersion, link.path]">
          <h2 class='flex items-center gap-2 m-0 text-base font-bold'>
            {{ link.label | translate }}
          </h2>
        </a>
      }
    </nav>
    <mat-tab-nav-panel #tabPanel class="">
      <router-outlet/>
    </mat-tab-nav-panel>
  </div>
}
