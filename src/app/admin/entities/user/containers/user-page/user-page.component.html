@if (loading) {
  <rb-loader [loadingText]='"loading" | translate' />
}

<rb-breadcrumb />

<rb-details-page-header [entity]="entity" [entityName]="ENTITY_NAME.user"
                        (action)="onAction($event.mode, $event.entity)"
                        [buttons]="{delete: {disabled: deleteDisabled}}">
  <rb-activate extraButton [entity]="entity" />
  <rb-user-details [entity]='entity' />
</rb-details-page-header>
