@if (activated()) {
  <mat-icon class="material-symbols-outlined text-green-600"
        [matTooltip]="'ADMIN.user.activated.label' | translate ">
    verified
  </mat-icon>
} @else {
  <mat-icon class="material-symbols-outlined text-red-600"
        [matTooltip]="'ADMIN.user.notActivated.label' | translate">
    verified_off
  </mat-icon>
}
