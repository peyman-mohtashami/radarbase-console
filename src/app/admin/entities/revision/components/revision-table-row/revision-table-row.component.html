<app-entity [gridView]="gridView()"
            [tableFields]="configService.getTableFields()"
            [extensionClass]="extensionClass()"
            [customTemplate]="entityTemplate"
            [updated]="updated()">
</app-entity>

<ng-template #entityTemplate let-property>
  @switch (property.name) {
    @case ('modifications') {
      <app-modification class="flex gap-2" [revision]="entity()"/>
    }
    @case ('timestamp') {
      <app-local-date [date]="entity()['timestamp']" [format]="'long'"/>
    }
    @default {
      {{ $any(entity())[property.name] || '-' }}
    }
  }
</ng-template>
