@for (type of REVISION_TYPES | keyvalue; track type) {
  @for (entity of REVISION_ENTITIES | keyvalue; track entity) {
    @for (item of revision()?.changes[type.key][entity.key]; track item) {
      <a [routerLink]="[entity.value, item.name, 'revisions', revision()?.id]" >
        <rb-tag [class]="type.value">{{'ADMIN.revision.entity.' + entity.key | translate }} {{item.name}}</rb-tag>
      </a>
    }
  }
}
