<div [formGroup]="form" class="grid grid-cols-1 min-w-[500px] w-1/2 mx-auto">
  <div class='small-input text-sm flex justify-end gap-1 sticky top-0 z-10 bg-white'>
    @for (language of languages(); track language.id) {
      <button mat-icon-button class="tiny uppercase"
              (click)='switchLanguage($event, language)'
              [class]="protocolStateService.selectedLanguage() === language.id ? 'text-primary! dark:text-primary-dark!' : 'text-neutral-400! dark:text-neutral-500!'">
              <span class="h-full flex items-center justify-center">
                <span class="text-sm font-bold">{{ language.id }}</span>
              </span>
      </button>
    }
  </div>

  <div class="text-sm w-1/2">
    <label id="show-introduction">Show Introduction</label>
    <mat-form-field class='small-input' appearance='outline'>
      <mat-select formControlName="showIntroduction">
        <mat-option [value]="false">No</mat-option>
        <mat-option [value]="true">Once</mat-option>
        <mat-option value="always">Always</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  @if (form.controls.showIntroduction.value) {
    <app-text-form-group class="mb-4" formControlName="startText"
                         [languages]="languages()"
                         label="Introduction text (per language)"
                         [textarea]="true"
                         [textareaAutosize]="true"/>
  }

  <app-text-form-group class="mb-4"
                       formControlName="endText"
                       [languages]="languages()"
                       label="End text (per language)"
                       [textarea]="true"
                       [textareaAutosize]="true"/>

  <app-text-form-group formControlName="warn"
                       [languages]="languages()"
                       label="Warning text (per language)"
                       [textarea]="true"
                       [textareaAutosize]="true"/>

  @if (!onDemand()) {
    <mat-divider class="mt-4!"/>
    <div formGroupName="notification" class="mt-4">
      <p class="text-base">Notification</p>
      <app-text-form-group class="mb-4"
                           formControlName="title"
                           [languages]="languages()"
                           label="Title (per language)"
                           [textarea]="true"
                           [textareaAutosize]="true"/>

      <app-text-form-group formControlName="text"
                           [languages]="languages()"
                           label="Message (per language)"
                           [textarea]="true"
                           [textareaAutosize]="true"/>
    </div>
  }
</div>
