<app-dialog-title [dialogMode]='dialogData.mode'
                  [entityMetadata]="configService.getEntityMetadata()"
                  (closeClicked)='close()'/>
<mat-dialog-content>
  @if (dialogData.mode === DialogMode.VIEW || dialogData.mode === DialogMode.DELETE) {
    <app-dialog-body-description [dialogMode]="dialogData.mode"
                                 [label]="'Config'"
                                 [entityName]="dialogData.entity._name" />
  }

  @if (dialogData.mode === DialogMode.ADD || dialogData.mode === DialogMode.EDIT) {
    <form [formGroup]="form" novalidate>
      <label for="name" class="text-sm">{{ 'ADMIN.config.name.label' | translate }}</label>
      <mat-form-field subscriptSizing="fixed"
                      appearance="outline">
        <input matInput formControlName='name' required/>
      </mat-form-field>

      <label for="name" class="text-sm">{{ 'ADMIN.config.value.label' | translate }}</label>
      <mat-form-field subscriptSizing="fixed"
                      appearance="outline">
        <textarea cdkTextareaAutosize matInput rows="1" formControlName='value'></textarea>
      </mat-form-field>
    </form>
  }
</mat-dialog-content>

@if (error()) {
  <div
      class="p-4 w-full text-center text-base rounded-sm break-words bg-red-100 text-red-600 dark:bg-red-800 dark:text-red-200">
    {{ error()?.error.errorCode | translate }}
  </div>
}

<app-dialog-actions [dialogMode]='dialogData.mode'
                    [form]='form'
                    (actionTriggered)='onAction($event)'/>
