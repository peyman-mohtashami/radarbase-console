@let _prefix = 'ADMIN.questionnaire.dialog';
<div class="flex h-full gap-1">
  <div class="w-1/4 p-2 h-full overflow-y-auto flex flex-col gap-2 bg-primary/5">
    <span class="font-bold">Question Types</span>
    @for (group of QUESTION_TYPES; track $index) {
      <div class="flex flex-col gap-2">
      @for (type of group.types; track type.type) {
        <button mat-stroked-button color="primary" (click)="addQuestion(type.type)" [disabled]="type.disabled">
          <span class="text-base">{{ type.label }}</span>
        </button>
      }
        <div class="h-px border-b-2 border-b-gray-300"></div>
      </div>
    }
  </div>

  <div class="grow w-3/4 h-full overflow-y-auto">
    <div class="p-2 relative">
      <span class="font-bold">{{ `${_prefix}.questionsLabel` | translate }}</span>
      <div #choicesContainer cdkDropList (cdkDropListDropped)="onDrop($event)" cdkDropListOrientation="vertical">
        @for (question of questions; track question._dragId; let index = $index) {
          <div
            cdkDrag
            [cdkDragBoundary]="choicesContainer"
            cdkDragLockAxis="y">
          <app-question-button [entity]="question"
                               [index]="$index"
                               (removeEvent)="removeQuestion(index)"
                               (selectEvent)="onSelectQuestion(index, question)"/>
<!--                               [language]="entity().defaultLanguage"-->
<!--                               [selected]="index === selectedQuestionIndex()"-->
          </div>

        }
      </div>
    </div>
  </div>

<!--  <div class=" grow w-5/12  h-full overflow-y-auto">-->

<!--      @if (selectedQuestionIndex() === index) {-->

<!--                      (changeEvent)="onQuestionChange($event)"/>-->
<!--        </div>-->
<!--      }-->
<!--    }-->
<!--  </div>-->
</div>
