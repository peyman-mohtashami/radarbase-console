@let _prefix = 'ADMIN.questionnaire.dialog';

<label for="select_choices_or_calculations" class="text-sm">
  {{ `${_prefix}.questionChoicesLabel` | translate }} *
</label>
<div cdkDropList (cdkDropListDropped)="onDrop($event)" class="">
  <div class="w-full flex-col mt-0 mb-1 text-sm">
    <div class="flex items-center gap-1 w-full">
      <div class="w-[28px] flex-grow-0"></div>
      <div class="w-3/12 flex-grow-0">{{ `${_prefix}.questionChoiceCode` | translate }}</div>
      <div class="flex-grow-1">{{ `${_prefix}.questionChoiceLabel` | translate }}</div>
      <div class="w-[28px] flex-grow-0"></div>
    </div>

    @if (form.controls.length) {
      @for (choice of form.controls; let i = $index; track choice) {
        <app-choice-form-group class="block"
                               [formControl]="choice"
                               [questionIndex]="i"
                               [languages]="languages()"
                               [choiceFullList]="form.value"
                               (remove)="removeItem(i)"/>
      }
    }
    <div class="flex items-center gap-1 w-full">
      <div class="flex-grow-1"></div>
      <button class="tiny w-[28px]! flex-grow-0 flex-shrink-0 material-symbols-outlined" mat-icon-button
              (click)="addItem()">
        <mat-icon class="material-symbols-outlined">add_circle</mat-icon>
      </button>
    </div>
  </div>
</div>
