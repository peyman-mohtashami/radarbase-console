@let selectedLanguage = questionnaireStateService.defaultLanguage();
<!--selectedLanguage();-->

<div class="flex flex-col h-full">
  <app-scrollable-content class="grow">
<!--    (timestamp)="onInputChange(+$event)">-->
    <app-question-header class="" [question]="question()" />
      @for (item of question().select_choices_or_calculations; track item.code) {
        <mat-card>
          <mat-card-content>
              <p class="text-sm!">{{ item.code }}</p>
              <p class="text-base! pb-32 text-black" [innerHtml]="item.label[selectedLanguage] | replacePlaceholders"></p>
          </mat-card-content>
        </mat-card>
      }
  </app-scrollable-content>
</div>
