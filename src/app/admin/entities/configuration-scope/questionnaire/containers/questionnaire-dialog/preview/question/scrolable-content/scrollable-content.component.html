
<ion-content #content
             (ionScroll)="updateInputScroll()"
             [scrollEvents]="true">
  <div class="px-4 pt-4">
    <ng-content />
  </div>

  @if (showScrollInputButton) {
    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button size="small" (click)="onInputScroll()">
        <ion-icon name="chevron-down-outline" />
      </ion-fab-button>
    </ion-fab>
  }
  <div class="opacity-0">{{isVisible()}}</div>

</ion-content>
