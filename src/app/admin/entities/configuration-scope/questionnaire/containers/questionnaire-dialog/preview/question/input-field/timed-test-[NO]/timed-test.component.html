<div class="flex flex-col h-full">
  <app-scrollable-content class="grow">
    <app-question-header class="" [question]="question()"/>
  </app-scrollable-content>

  <div class="m-4">
    <div class="overflow-hidden rounded-lg text-center">
      @if (!isDisabled) {
        <span class="text-7xl">{{ taskTimer.displayTime }}</span>
      } @else {
        <div class="text-lg">Done!</div>
      }
    </div>

    @if (!isDisabled) {
      <ion-button shape="round" expand="full" (click)="startTimer()" [disabled]="taskTimer.hasStarted">
        {{ selectedValue ? "Start again" : "Start"}}
      </ion-button>
    }
  </div>

</div>
