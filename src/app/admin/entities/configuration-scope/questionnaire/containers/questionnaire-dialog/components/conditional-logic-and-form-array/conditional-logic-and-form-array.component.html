<div cdkDropList (cdkDropListDropped)="onDrop($event)" class="">
  <div class="w-full flex-col mt-0 mb-1 text-sm">
    <div class="flex items-center gap-1 w-full">
      <div class="w-7 grow-0"></div>
      <div class="w-1/4 grow-0">Operand</div>
      <div class="w-1/4 grow-0">Operator</div>
      <div class="w-1/4 grow-0">Value</div>
    </div>

    @if (form.controls.length) {
      @for (choice of form.controls; let i = $index; track choice) {
        <app-conditional-logic-item-form-group [formControl]="choice" />
<!--        <app-choice-form-group class="block"-->
<!--                               [formControl]="choice"-->
<!--                               [questionIndex]="i"-->
<!--                               [languages]="languages()"-->
<!--                               [choiceFullList]="form.value"-->
<!--                               (remove)="removeItem(i)"/>-->
<!--        HHH-->
      }
    }
    <div class="flex items-center gap-1 w-full">
      <div class="grow"></div>
      <button type="button" mat-stroked-button color="primary" (click)="addItem()">
        <mat-icon>add</mat-icon>
        <span class="font-bold">AND</span>
      </button>
<!--      <button class="tiny w-7! grow-0 shrink-0 material-symbols-outlined" mat-icon-button-->
