  <div>
    <label for="estimatedCompletionTime" class="text-sm">
      {{ `${_prefix}.estimatedCompletionTimeLabel` | translate }}
    </label>
    <mat-form-field class='small-input w-full' appearance='outline'>
      <input id="estimatedCompletionTime" matInput type="number" formControlName='estimatedCompletionTime'>
      <span matSuffix class="mx-4 text-neutral-500 dark:text-neutral-400">
        {{ `${_prefix}.minutes` | translate }}
      </span>
    </mat-form-field>
  </div>

  <div class="mb-4">
    <app-text-form-group formControlName="endText"
                         [languages]="entity()!.languages"
                         [language]="entity()!.defaultLanguage"
                         [label]="`${_prefix}.endTextLabel` | translate"
                         [textarea]="true"
                         [textareaAutosize]="true"/>
  </div>

  <mat-slide-toggle formControlName='warningEnabled' class="my-4" color="primary">
    {{ `${_prefix}.warningEnabled` | translate }}
  </mat-slide-toggle>

  @if (form.controls.warningEnabled.value) {
    <div class="mb-4">
      <app-text-form-group formControlName="warn"
                           [languages]="entity()!.languages"
                           [language]="entity()!.defaultLanguage"
                           [label]="`${_prefix}.warningTextLabel` | translate"/>
    </div>
  }
</form>
