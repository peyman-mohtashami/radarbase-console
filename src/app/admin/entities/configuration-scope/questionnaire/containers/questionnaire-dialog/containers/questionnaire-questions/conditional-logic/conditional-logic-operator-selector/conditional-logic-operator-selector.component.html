<mat-form-field class='small-input w-full! grow-0' appearance='outline' subscriptSizing="dynamic">
  <mat-select [value]="conditionalLogicItem()?.operator" (selectionChange)="onInputChange($event)">
    @for (type of OPERATORS[question().field_type]; track type) {
      <mat-option [value]="type.value">{{ type.name }}</mat-option>
    }
  </mat-select>
</mat-form-field>
