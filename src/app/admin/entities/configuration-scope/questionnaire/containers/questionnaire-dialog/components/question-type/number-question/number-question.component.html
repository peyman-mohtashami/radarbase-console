@let _prefix = 'ADMIN.questionnaire.dialog';

@switch (type) {
  @case ('button') {
  }
  @case ('form') {
    <label for="unit" class="text-sm">{{ `${_prefix}.questionValidationLabel` | translate }}</label>
    <fieldset class="p-2 rounded-sm border flex gap-2">
      <div>
        <div>
          <label for="text_validation_min"
                 class="text-sm">{{ `${_prefix}.questionTextValidationMin` | translate }}</label>
        </div>
        <mat-form-field class='small-input' appearance="outline">
          <input id="text_validation_max" matInput [formControl]='text_validation_min' type="number"/>
        </mat-form-field>
      </div>

      <div>
        <div>
          <label for="text_validation_max"
                 class="text-sm">{{ `${_prefix}.questionTextValidationMax` | translate }}</label>
        </div>
        <mat-form-field class='small-input' appearance="outline">
          <input id="text_validation_max" matInput [formControl]='text_validation_max' type="number"/>
        </mat-form-field>
      </div>
    </fieldset>

    <div class="mt-4">
      <div>
        <label for="matrix_group_name"
               class="text-sm">{{ `${_prefix}.questionMatrixGroupName` | translate }}</label>
      </div>
      <mat-form-field class='small-input' appearance="outline">
        <input id="matrix_group_name" matInput [formControl]='matrix_group_name'/>
      </mat-form-field>
    </div>
  }
  @case ('preview') {
    <app-question-header [question]="entity()" [language]="language()"/>

    <mat-form-field subscriptSizing="fixed" appearance="outline">
      <input matInput maxlength="256" [value]="answer()?.value" [disabled]="isPreviewDisabled"
             (input)="onPreviewInputChange($event)" [min]="entity().text_validation_min" [max]="entity().text_validation_max"
             [type]="'number'">
    </mat-form-field>
    @if (error) {
      <p class="text-red-700">{{ error }}</p>
    }

    @if (!isPreviewDisabled) {
      <button color="warn" matButton class="my-4 text-sm!" (click)="onPreviewInputChange(null)">
        Clear
      </button>
    }
  }
  @case ('logic') {
    <div class="">
      <mat-form-field class='small-input' appearance='outline'>
        <input matInput (input)="onLogicInputChange($event)" [value]="value" required type="number">
      </mat-form-field>
    </div>
  }
}
