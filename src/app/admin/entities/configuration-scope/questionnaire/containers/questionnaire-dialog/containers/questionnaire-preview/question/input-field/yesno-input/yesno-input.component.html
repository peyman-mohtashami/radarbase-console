<mat-radio-group aria-label="Select an option" [value]="answer()?.value">
  @for (option of defaultYesNoResponse; track option.code) {
    <div>
      <mat-radio-button [value]="option.code" (click)="onInputChange(option.code)" [disabled]="isDisabled">
        <span class="ion-text-wrap">{{ option.label | translate }}</span>
      </mat-radio-button>
    </div>
  }
</mat-radio-group>
@if (!isDisabled) {
  <button matButton class="m-4" (click)="onReset()" color="danger" size="small">
    Clear
  </button>
}
