@let _prefix = 'ADMIN.questionnaire.dialog';

<app-dialog-title [dialogMode]='dialogData.mode'
                  [entityMetadata]="{name: 'conditionalLogic', icon: ''}"
                  [entityName]="dialogData.mode !== DialogMode.ADD ? dialogData.entity?.value : undefined"
                  (closeEvent)='close()'>
</app-dialog-title>


<mat-dialog-content class="h-full overflow-auto">
  @if (dialogData.mode === DialogMode.VIEW || dialogData.mode === DialogMode.DELETE) {
    <app-dialog-body-description [dialogMode]="dialogData.mode"
                                 [label]="`ADMIN.questionnaire.name.label` | translate"
                                 [entityName]="dialogData.entity?.value"/>
  }

  @if (dialogData.mode === DialogMode.ADD || dialogData.mode === DialogMode.EDIT) {
    <form [formGroup]='form' novalidate class="grid grid-cols-2 grid-rows-[auto_1fr] h-full gap-4">

<!--      <div class="">-->
<!--        <label for="name" class="text-sm">{{ `${_prefix}.nameLabel` | translate }} *</label>-->
<!--        <mat-form-field class='small-input w-1/2' appearance='outline'>-->
<!--          <input matInput formControlName='value' required>-->

<!--          <mat-error>-->
<!--            @if (form.controls.value.errors; as errors) {-->
<!--              @if (errors['required']) {-->
<!--                {{ ValidatorError.requiredValidator | translate: {value: `${_prefix}.nameLabel` | translate} }}-->
<!--              }-->
<!--            }-->
<!--          </mat-error>-->
<!--        </mat-form-field>-->
<!--      </div>-->
      <app-conditional-logic-or-form-array class="col-span-2"
                                           [formControl]="form.controls.orArray" />
<!--                                           [languages]="form.controls.languages.value"/>-->

<!--      <app-questions-form-array class="col-span-2"-->
<!--                                formControlName="questions"-->
<!--                                [languages]="form.controls.languages.value"/>-->
    </form>
    }
</mat-dialog-content>

@if (error()) {
  <app-error-message-box>
    {{ error()?.error.errorCode | translate }}
  </app-error-message-box>
}

<app-dialog-actions [dialogMode]='dialogData.mode'
                    [form]='form'
                    (actionTriggered)='onAction($event)'/>
