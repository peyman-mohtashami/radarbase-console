<div class="flex flex-col h-full">
  <app-scrollable-content class="grow">
    <app-question-header class="" [question]="question()"/>
  </app-scrollable-content>

  <div class="m-4">
    @if (!isRecording) {
      @if (!isDisabled && buttonShown) {
        <ion-button shape="round" expand="full" (click)="handleRecording()">
          {{ selectedValue ? "Start again" : 'BTN_START' | translate }}
        </ion-button>
      } @else {
        <div class="p-4 rounded-lg text-center text-lg">
          Done!
        </div>
      }
    } @else {
      <ion-button shape="round" expand="full" color="danger" (click)="handleRecording()">
        {{ 'BTN_STOP' | translate }}
      </ion-button>
    }
  </div>
</div>

<ion-alert [isOpen]="taskInterruptedAlert"
           [header]="'AUDIO_TASK_ALERT' | translate"
           [message]="'AUDIO_TASK_ALERT_DESC' | translate"
           [buttons]="[{text: 'BTN_OKAY' | translate, handler: taskInterruptedAlertConfirm}]"
           [backdropDismiss]="true"
           (didDismiss)="taskInterruptedAlert = false"/>

<ion-alert [isOpen]="afterAttemptAlert"
           [header]="'AUDIO_TASK_HAPPY_ALERT' | translate"
           [message]="('AUDIO_TASK_ATTEMPT_ALERT' | translate) + ' ' + attemptsLeft"
           [buttons]="[{text: 'BTN_YES' | translate, handler: finishRecording},
                       {text: ('BTN_NO' | translate) + ', ' + ('BTN_TRY_AGAIN' | translate)}]"
           [backdropDismiss]="true"
           (didDismiss)="afterAttemptAlert = false"/>
