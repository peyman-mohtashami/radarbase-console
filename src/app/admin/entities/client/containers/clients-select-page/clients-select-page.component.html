@if (scope === 'global') {
  <div
      class='sticky top-0 z-40 flex flex-wrap justify-between gap-2 p-4 w-full bg-app-background dark:bg-app-background-dark'>
    <h2 class='flex items-center gap-2 m-0 text-lg font-bold '>
    <span class="p-2 w-10! h-10! rounded-full bg-primary dark:bg-primary-dark font-bold text-on-primary relative">
      <span
          class="material-symbols-outlined absolute left-1 top-1 opacity-50">{{ ENTITY_REGISTRY.appConfig.icon }}</span>
      <span class="material-symbols-outlined absolute left-2 top-2">{{ ENTITY_REGISTRY.appConfig.icon }}</span>
    </span>
      <span
          class="text-primary dark:text-primary-dark">{{ `ADMIN.${ENTITY_REGISTRY.appConfig.name}.global.title` | translate }}</span>
    </h2>
  </div>
}

<div class='p-0'>
  @if (form) {
    <form [formGroup]='form' novalidate class="flex items-center gap-4 p-4 pb-0">
      <div class="w-1/3!">
        <p>
          <label for="client" class="text-sm">{{ `ADMIN.client.selectClient` | translate }}</label>
        </p>
        <mat-form-field class='w-full! small-input'
                        appearance='outline'>
          <mat-select formControlName='client'>
            @for (entity of entities; track entity.clientId) {
              <mat-option [value]="entity.clientId">{{ entity.clientId }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </form>
    <router-outlet/>
  }
</div>
