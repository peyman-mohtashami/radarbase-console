<h2 mat-dialog-title class="border-b-2">
  <span class='inline-flex items-center justify-between w-full'>
    <span class="text-lg">
      <span>{{'ADMIN.subject.assignGroup.title' | translate }}</span>
    </span>
    <button mat-icon-button
            (click)='close()'>
      <span class="material-symbols-outlined">close</span>
    </button>
  </span>
</h2>


<mat-dialog-content>
  <form [formGroup]="form" novalidate>
    <rb-mat-select-autocomplete [options]="groups" formControlName='group' [label]="'ADMIN.subject.group.label' | translate"/>
<!--    <mat-form-field class='w-full mt-4'-->
<!--                    appearance="outline"-->
<!--                    floatLabel="always">-->
<!--      <mat-label>{{'ADMIN.subject.group.label' | translate }}</mat-label>-->
<!--      <mat-select formControlName='group'>-->
<!--        <mat-option *ngFor='let group of groups' [value]='group.name'>-->
<!--          {{group.name}}-->
<!--        </mat-option>-->
<!--      </mat-select>-->
<!--    </mat-form-field>-->

  </form>
</mat-dialog-content>

@if (error()) {
  <rb-message />
}

<div class='px-6 py-4 flex flex-wrap justify-between gap-2 w-full'>
  <div class='flex flex-wrap gap-2'>
    <button mat-stroked-button
            color='primary'
            type='button'
            class='close-button'
            [mat-dialog-close]='true'
            (click)='close()'>
      {{ 'ADMIN.subject.assignGroup.cancel' | translate }}
    </button>
  </div>
  <div class='action-buttons-container-right'>
    <button mat-raised-button
            color='primary'
            type='submit'
            name='update'
            [disabled]='!form.valid || !form.dirty || isLoading'
            (click)='save()'>
      @if (isLoading) {
        <mat-icon><mat-spinner diameter='20' /></mat-icon>
      }
      {{'ADMIN.subject.assignGroup.assign' | translate }}
    </button>
  </div>
</div>
