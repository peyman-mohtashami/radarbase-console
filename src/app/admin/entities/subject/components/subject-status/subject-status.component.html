<div class="flex items-center gap-2">
  @switch(status()) {
    @case (SubjectStatus.DEACTIVATED) {
      <span class="text-xl material-symbols-outlined font-bold text-red-500"
            [matTooltip]="status()">
        disabled_by_default
      </span>
    }
    @case (SubjectStatus.ACTIVATED) {
      <span class="text-xl material-symbols-outlined font-bold text-green-500"
            [matTooltip]="status()">
        verified_user
      </span>
    }
    @case (SubjectStatus.DISCONTINUED) {
      <span class="text-xl material-symbols-outlined font-bold text-yellow-500"
            [matTooltip]="status()">
        stop_circle
      </span>
    }
    @case (SubjectStatus.INVALID) {
      <span class="text-xl material-symbols-outlined font-bold text-gray-500"
            [matTooltip]="status()">
        warning
      </span>
    }
    @default {
      <span>-</span>
    }
  }
  @if (type() !== DetailType.TABLE) {
    <span>{{status()}}</span>
  }
</div>
