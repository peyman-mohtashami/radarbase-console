@if (mode() === "MENU") {
  <button class="hover:text-primary hover:bg-transparent! transition-all"
        mat-menu-item
        (click)='pairApp()'>
    <span class="flex items-center gap-2">
      <span class="text-xl text-primary-color-500 material-symbols-outlined font-bold">qr_code</span>
      <span>{{ 'Pair app' | translate }}</span>
    </span>
  </button>
} @else {
  <button class="tiny"
          mat-icon-button color="primary"
          (click)='pairApp()'>
    <span class="text-xl! material-symbols-outlined font-bold">qr_code</span>
  </button>
}
