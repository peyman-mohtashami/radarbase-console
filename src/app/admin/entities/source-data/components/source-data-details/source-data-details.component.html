<rb-details [name$]="ENTITY_NAME.sourceData"
            [entity$]="entity$()"
            [tableFields$]="tableFields$()"
            [type$]="type$()"
            [customTemplate$]="detailsTemplate" />

<ng-template #detailsTemplate let-property>
  @switch (property.name) {
    @case ('sourceType') {
      <rb-source-data-source-type [sourceType$]="entity$().sourceType"/>
    }
    @case ('processingState') {
      <rb-source-data-processing-state [processingState$]="entity$().processingState"/>
    }
    @default {
      {{ entity$()[property.name] || '-' }}
    }
  }
</ng-template>
