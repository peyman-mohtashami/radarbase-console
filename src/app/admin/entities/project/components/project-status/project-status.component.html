@switch (projectStatus$()) {
  @case (ProjectStatus.PLANNING) {
    <rb-tag class="bg-blue-500 text-white">{{ projectStatus$() }}</rb-tag>
  }
  @case (ProjectStatus.ONGOING) {
    <rb-tag class="bg-green-500 text-white">{{ projectStatus$() }}</rb-tag>
  }
  @case (ProjectStatus.ENDED) {
    <rb-tag class="bg-red-500 text-white">{{ projectStatus$() }}</rb-tag>
  }
  @default {
    <!-- TODO -->
      <!--    <span class="text-gray-500">-</span>-->
  }
}
