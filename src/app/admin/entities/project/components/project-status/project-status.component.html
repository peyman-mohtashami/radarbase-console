@switch (projectStatus$()) {
  @case (ProjectStatus.PLANNING) {
    <rb-tag class="bg-secondary text-white">{{ projectStatus$() }}</rb-tag>
  }
  @case (ProjectStatus.ONGOING) {
    <rb-tag class="bg-tertiary text-white">{{ projectStatus$() }}</rb-tag>
  }
  @case (ProjectStatus.ENDED) {
    <rb-tag class="bg-gray-200 text-gray-800">{{ projectStatus$() }}</rb-tag>
  }
  @default {
  }
}
