@switch (projectStatus()) {
  @case ('PLANNING') {
    <app-tag class="bg-secondary text-white">{{ projectStatus() }}</app-tag>
  }
  @case ('ONGOING') {
    <app-tag class="bg-tertiary text-white">{{ projectStatus() }}</app-tag>
  }
  @case ('ENDED') {
    <app-tag class="bg-gray-200 text-gray-800">{{ projectStatus() }}</app-tag>
  }
  @default {
  }
}
