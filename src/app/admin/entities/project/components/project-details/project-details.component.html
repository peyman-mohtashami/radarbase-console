<app-details [entityMetadata]="configService.getEntityMetadata()"
            [tableFields]="configService.getTableFields()"
            [detailType]="detailType()"
            [customTemplate]="detailsTemplate"/>

<ng-template #detailsTemplate let-property>
  @switch (property.name) {
    @case ('startDate') {
      <app-local-date [date]="entity().startDate" [format]="'mediumDate'"/>
    }
    @case ('endDate') {
      <app-local-date [date]="entity().endDate" [format]="'mediumDate'"/>
    }
    @case ('projectStatus') {
      <app-project-status [projectStatus]="entity().projectStatus"/>
    }
    @case ('sourceTypes') {
      <app-project-source-types [sourceTypes]="entity().sourceTypes"/>
    }
    @case ('attributes') {
      {{ entity().attributes | json }}
    }
    @default {
      {{ $any(entity())[property.name] || "-" }}
    }
  }
</ng-template>
