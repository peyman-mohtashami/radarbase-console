<span class="h-6 inline-flex align-middle items-center mx-0.5 py-0.5 px-1.5 rounded-full text-nowrap cursor-pointer bg-tertiary/10 text-tertiary"
      [attr.title]="questionName">

  <mat-icon class="material-symbols-outlined text-lg!">data_array</mat-icon>

  <span class="overflow-hidden max-w-62.5 text-ellipsis">{{ questionName }}</span>

  <button mat-icon-button type="button" color="tertiary" class="tiny" contenteditable="false" tabindex="-1" aria-label="Remove question"
          (mousedown)="$event.preventDefault()"
          (click)="remove()">
    <mat-icon class="material-symbols-outlined text-lg!">close</mat-icon>
  </button>

</span>
