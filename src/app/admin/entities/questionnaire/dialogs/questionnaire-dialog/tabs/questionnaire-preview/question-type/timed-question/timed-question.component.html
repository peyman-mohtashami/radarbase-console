@let _prefix = 'ADMIN.questionnaire.dialog';

<div class="flex flex-col h-full">
  <app-question-header [question]="entity()" [language]="language()"/>
  <div class="overflow-hidden rounded-lg text-center">
    @if (!isPreviewDisabled) {
      <span class="text-7xl">{{ taskTimer.displayTime() }}</span>
    } @else {
      <div class="text-lg">Done!</div>
    }
  </div>

  @if (!isPreviewDisabled) {
    <button mat-raised-button class="w-full mt-8" (click)="startTimer()" [disabled]="taskTimer.hasStarted()"
            color="primary" size="small">
      Start
    </button>
  }

</div>
