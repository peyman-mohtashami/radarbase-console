<app-question-header [question]="entity()" [language]="language()"/>

<mat-form-field class="small-input" appearance='outline'>
  <input
    [min]="getDateISOString(entity().text_validation_min | replacePlaceholders)"
    [max]="getDateISOString(entity().text_validation_max | replacePlaceholders)"
    [value]="previewDateValue" matInput [matDatepicker]="dp" readonly (click)="dp.open()"
    (dateChange)="onPreviewDateInputChange($event)">
  <mat-datepicker-toggle matIconSuffix [for]="dp"></mat-datepicker-toggle>
  <mat-datepicker #dp></mat-datepicker>
</mat-form-field>

@if (error) {
  <p class="text-red-700 text-sm mt-4">{{ error }}</p>
}

@if (!isPreviewDisabled) {
  <button color="warn" matButton class="my-4 text-sm!" (click)="onPreviewDateInputChange(null)">
    Clear
  </button>
}
