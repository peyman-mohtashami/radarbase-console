@let _i18nEntity = 'ADMIN.questionnaire.dialog';

<form novalidate class="grid grid-cols-2 gap-4">
  <div>
    <app-input-form-field [field]="form.name" [label]="`${_i18nEntity}.name`" [required]="true"/>

    <app-searchable-multi-select [field]="form.languages"
                                 [label]="`${_i18nEntity}.languages`"
                                 [disabledItem]="form.defaultLanguage().value()"
                                 [labelKey]="'label'"
                                 [options]="ISO_LANGUAGES"
                                 [valueKey]="'code'"
                                 [multiple]="true"/>

    <app-searchable-multi-select [field]="form.defaultLanguage"
                                 [label]="`${_i18nEntity}.defaultLanguage`"
                                 [labelKey]="'label'"
                                 [options]="form.languages().value()"
                                 [valueKey]="'code'"
                                 [multiple]="false"/>

    <mat-slide-toggle [formField]="form.onDemand" class="mx-3 my-4" color="primary" (click)="onClickSlideToggle()">
      {{ `${_i18nEntity}.onDemand` | translate }}
    </mat-slide-toggle>

    <app-input-form-field [field]="form.estimatedCompletionTime"
                          [label]="`${_i18nEntity}.estimatedCompletionTime`"
                          type="number"/>

    <div>
      <mat-slide-toggle [formField]="form.autoNextEnabled" class="mx-3 my-4" color="primary" (click)="onClickSlideToggle()">
        {{ `${_i18nEntity}.autoNextQuestionEnabled` | translate }}
      </mat-slide-toggle>
    </div>

    <div>
      <mat-slide-toggle [formField]="form.previousEnabled" class="mx-3 my-4" color="primary" (click)="onClickSlideToggle()">
        {{ `${_i18nEntity}.previousQuestionEnabled` | translate }}
      </mat-slide-toggle>
    </div>

    <div>
      <mat-slide-toggle [formField]="form.editEnabled" class="mx-3 my-4" color="primary" (click)="onClickSlideToggle()">
        {{ `${_i18nEntity}.editQuestionEnabled` | translate }}
      </mat-slide-toggle>
    </div>
  </div>
