@let _prefix = 'ADMIN.questionnaire.dialog';

<form novalidate class="grid grid-cols-2 gap-4">
  <div>
    <div class="">
      <label for="name" class="text-sm">{{ `${_prefix}.nameLabel` | translate }} *</label>
      <mat-form-field class='small-input' appearance='outline'>
        <input matInput [formField]="form.name">
        <mat-error>
          @if (form.name().touched() && form.name().invalid()) {
            @for (error of form.name().errors(); track error.kind) {
              {{ error.message }}
            }
          }
        </mat-error>
      </mat-form-field>
    </div>

    <div class="">
      <label for="languagesLabel" class="text-sm">{{ `${_prefix}.languagesLabel` | translate }}</label>
      <app-searchable-multi-select [formField]="form.languages"
                                   [disabledItem]="form.defaultLanguage().value()"
                                   [labelKey]="'label'"
                                   [options]="ISO_LANGUAGES"
                                   [valueKey]="'code'"
                                   [multiple]="true"/>
    </div>

    <div class="">
      <label for="defaultLanguageLabel" class="text-sm">{{ `${_prefix}.defaultLanguageLabel` | translate }} *</label>
      <app-searchable-multi-select [formField]="form.defaultLanguage"
                                   [labelKey]="'label'"
                                   [options]="form.languages().value()"
                                   [valueKey]="'code'"
                                   [multiple]="false"/>
    </div>

    <mat-slide-toggle [formField]="form.onDemand" class="my-4" color="primary">
      {{ `${_prefix}.onDemand` | translate }}
    </mat-slide-toggle>

    <div>
      <label for="estimatedCompletionTime" class="text-sm">
        {{ `${_prefix}.estimatedCompletionTimeLabel` | translate }}
      </label>
      <mat-form-field class='small-input w-full' appearance='outline'>
        <input id="estimatedCompletionTime" matInput type="number" [formField]="form.estimatedCompletionTime">
        <span matSuffix class="mx-4 text-neutral-500 dark:text-neutral-400">
        {{ `${_prefix}.minutes` | translate }}
      </span>
      </mat-form-field>
    </div>
  </div>
