@let _prefix = 'ADMIN.questionnaire.dialog';

<app-question-header [question]="entity()" [language]="language()"/>

@switch (entity().date_type) {
  @case ('time') {
    <mat-form-field class='small-input'
                    appearance='outline'
                    subscriptSizing="dynamic">
      <input matInput type="time" required (input)="onPreviewTimeInputChange($event)"/>
    </mat-form-field>
  }
  @default {
    <mat-form-field class="small-input" appearance='outline'>
      <input
        [min]="getDateISOString(entity().text_validation_min | replacePlaceholders)"
        [max]="getDateISOString(entity().text_validation_max | replacePlaceholders)"
        [value]="previewDateValue" matInput [matDatepicker]="dp3" readonly (click)="dp3.open()"
        (dateChange)="onPreviewDateInputChange($event)">
      <mat-datepicker-toggle matIconSuffix [for]="dp3"></mat-datepicker-toggle>
      <mat-datepicker #dp3></mat-datepicker>
    </mat-form-field>
  }
}

@if (!isPreviewDisabled) {
  <button color="warn" matButton class="my-4 text-sm!" (click)="onPreviewDateInputChange(null)">
    Clear
  </button>
}
