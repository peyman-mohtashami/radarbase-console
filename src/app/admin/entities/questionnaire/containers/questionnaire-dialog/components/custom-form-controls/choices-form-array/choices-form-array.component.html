<label for="select_choices_or_calculations" class="text-sm">Choices *</label>
@if (form.controls.length) {
  <div class="grid grid-cols-12 gap-2 text-sm">
    <div></div>
    <p class="col-span-3">Code</p>
    <p class="col-span-7">Label</p>
    <div></div>
  </div>

  <div cdkDropList (cdkDropListDropped)="onDrop($event)" class="">

    @for (choice of form.controls; let i = $index; track choice) {
      <div class="grid grid-cols-12 gap-1 mb-1" cdkDrag [formGroup]="choice">
        <div class="justify-self-center self-center">
          <span class="material-symbols-outlined">swap_vertical_circle</span>
        </div>
        <mat-form-field class='col-span-3 small-input' appearance='outline' subscriptSizing="dynamic">
          <input matInput formControlName="code">
        </mat-form-field>

        <app-text-form-group class="col-span-7"
                             formControlName="label"
                             [languages]="languages()"
                             [label]="undefined"/>

        <button class="justify-self-center self-center material-symbols-outlined text-red-500" (click)="removeItem(i)">
          remove_circle
        </button>
      </div>
    }

  </div>
} @else {
  <div class="text-base text-gray-400">
    No choices added yet
  </div>
}
<button class="material-symbols-outlined" (click)="addItem()">add_circle</button>
