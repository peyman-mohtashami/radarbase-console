upstream management-portal   { server management-portal:8080; }
upstream app-config           { server app-config:8090;        }
upstream app-config-frontend  { server app-config-frontend:8080; }
upstream radar-home           { server radar-home:8080;        }
# upstream radar-console        { server radar-console:8080;     }
# upstream radar-console        { server radar-console:9000;     }
upstream radar-console       { server host.docker.internal:9000; }

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

#     add_header Access-Control-Allow-Origin "http://localhost:8100" always;
#     add_header Access-Control-Allow-Credentials "true" always;
#     add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
#     add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
#
#     if ($request_method = OPTIONS) {
#         add_header Access-Control-Allow-Origin "http://localhost:8100";
#         add_header Access-Control-Allow-Credentials "true";
#         add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
#         add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
#         return 204;
#     }

    # App Config backend API  (must be declared before /appconfig)
    location /appconfig/api {
        proxy_pass http://app-config;

        add_header Access-Control-Allow-Origin "http://localhost:8100" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # App Config frontend SPA
    location /appconfig {
        proxy_pass http://app-config-frontend;
    }

    # Management Portal  (Spring Boot app with /managementportal context path)
    location /managementportal {
        proxy_pass         http://management-portal;

        add_header Access-Control-Allow-Origin "http://localhost:8100" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_read_timeout 300s;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # Radar Console
#     location /radarbase-console {
#         proxy_pass http://radar-console;
#     }

    location /radarbase-console/ {
        proxy_pass http://radar-console;
#         proxy_pass http://localhost:9000/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

#     location /radarbase-console/ {
#         proxy_pass http://radar-console;
#         #proxy_set_header Host localhost;
#
#         proxy_http_version 1.1;
#
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection "upgrade";
#     }

    # Radar Home – catch-all
    location / {
        proxy_pass http://radar-home;
    }
}
